services:
  ms-ventas:
    build: .
    container_name: fit-ventas-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://fit-postgres:5432/ventas_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-fit_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-fit_pass}
      SERVER_PORT: 8091
    ports:
      - "8091:8091"
    networks:
      - fit-network

networks:
  fit-network:
    external: true
